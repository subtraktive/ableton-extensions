<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Clips by Name</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #e8e8e8;
        background: #1a1a1a;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 16px;
        color: #999;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #bbb;
      }

      .folder-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      input[type="text"] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid #444;
        border-radius: 4px;
        background: #111;
        color: #eee;
      }

      button {
        padding: 8px 14px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2a2a2a;
        color: #eee;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      button.primary {
        background: #0078d4;
        border-color: #0078d4;
      }

      button.primary:hover {
        background: #1084d8;
      }

      button.primary:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .clips {
        margin-bottom: 16px;
        border: 1px solid #333;
        border-radius: 4px;
        max-height: 180px;
        overflow-y: auto;
      }

      .clip-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px;
        border-bottom: 1px solid #2a2a2a;
      }

      .clip-row:last-child {
        border-bottom: none;
      }

      .clip-name {
        font-weight: 500;
      }

      .clip-file {
        color: #888;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 55%;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .empty {
        padding: 16px;
        color: #888;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Export Clips by Name</h1>
    <p class="subtitle" id="track-name"></p>

    <div class="clips" id="clips"></div>

    <label for="folder-path">Destination folder</label>
    <div class="folder-row">
      <input id="folder-path" type="text" placeholder="Choose a folder…" />
      <button type="button" id="browse">Browse…</button>
    </div>

    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="button" id="export" class="primary" disabled>Export</button>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const data = JSON.parse(decodeURIComponent(params.get("data") || "{}"));

      document.getElementById("track-name").textContent = data.trackName || "";
      document.getElementById("folder-path").value = data.folderPath || "";

      const clipsEl = document.getElementById("clips");
      const folderInput = document.getElementById("folder-path");
      const exportBtn = document.getElementById("export");

      function postMessage(payload) {
        const message = { method: "close_and_send", params: [JSON.stringify(payload)] };
        if (window.webkit?.messageHandlers?.live) {
          window.webkit.messageHandlers.live.postMessage(message);
        } else if (window.chrome?.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      function updateExportState() {
        exportBtn.disabled = !folderInput.value.trim() || !(data.clips || []).length;
      }

      if (!(data.clips || []).length) {
        clipsEl.innerHTML = '<div class="empty">No audio clips on this track.</div>';
      } else {
        for (const clip of data.clips) {
          const row = document.createElement("div");
          row.className = "clip-row";
          row.innerHTML =
            '<span class="clip-name"></span><span class="clip-file"></span>';
          row.querySelector(".clip-name").textContent = clip.name;
          row.querySelector(".clip-file").textContent = clip.fileName;
          clipsEl.appendChild(row);
        }
      }

      folderInput.addEventListener("input", updateExportState);
      updateExportState();

      document.getElementById("browse").addEventListener("click", () => {
        postMessage({ action: "browse", folderPath: folderInput.value.trim() });
      });

      document.getElementById("cancel").addEventListener("click", () => {
        postMessage({ action: "cancel" });
      });

      document.getElementById("export").addEventListener("click", () => {
        postMessage({
          action: "export",
          folderPath: folderInput.value.trim(),
        });
      });
    </script>
  </body>
</html>
